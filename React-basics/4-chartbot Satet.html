<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    
     
    <script type="text/babel">

      function ChartInput({chartMessages, setChartMessages})
      {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event)
        {
          setInputText(event.target.value);
        }
        function sendMessage()
        {
        
          const newChartMessages = [
          ...chartMessages,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
          ]

          setChartMessages(newChartMessages);

         const response= Chatbot.getResponse(inputText);

        setChartMessages([
          ...newChartMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
          ]);

          setInputText('');
          
        }

        return (
          <>
        <input placeholder ="Send a message to chatbot" 
        size = "30" 
        onChange={saveInputText}
        value={inputText}
        />
        
        <button onClick={sendMessage}>Send</button>
        </>
        );
      }

      function ChartBot({message, sender}){
        return (
          <div>
          {sender === 'robot' && <img src ="robot.png" width = "50" />}
          {message}
          {sender === 'user' && <img src ="user.png" width = "50" />}
          </div>
        );

      };

      function ChartMessage({chartMessages}){
        return (
        <>
        {chartMessages.map((chartMessages) => { 
          return (
            <ChartBot 
            message = {chartMessages.message}
            sender = {chartMessages.sender}
            key = {chartMessages.id}
            />
          );
        })}
        </>

        );

      }

     function App(){
      const [chatMessages, setChatMessages] = React.useState([{
          message: 'hello chartbot',
          sender: 'user',
          id: 'id1'
        },
        {
          message: 'Hello! How can I help you?',
          sender : 'robot',
          id: 'id2'
        },
         {
          message: 'can you get me todays date?',
          sender : 'user',
          id : 'id3'
        },
         {
          message: 'Today is August 24',
          sender : 'robot',
          id : 'id4'
        }]);
    // const [chatMessages, setChatMessages] =array;
    // const chatMessages = array[0];
    // const setChatMessages = array[10];

      return (
        <>
          <ChartInput 
          chartMessages = {chatMessages}
          setChartMessages = {setChatMessages}
          
          />
          <ChartMessage 
          chartMessages = {chatMessages}
          />
        </>
      );
     };
      
      
    const container = document.querySelector('.js-container');
    const root= ReactDOM.createRoot(container).render(<App />);
      

     
    </script>
  </body>
</html>
